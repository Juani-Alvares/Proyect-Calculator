<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101b1c" />
  <title>Calculadora científica</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="dark">
  <main class="calculator" aria-label="Calculadora científica">
    <header class="header">
      <div class="brand"><span class="brand-icon" aria-hidden="true">＋</span><div><p class="eyebrow">Juan Alvares </p><h1>Calculadora científica</h1></div></div>
      <button id="theme" class="icon-button" title="Cambiar tema" aria-label="Activar tema claro">☼</button>
    </header>
    <section class="screen" aria-label="Operación y resultado" aria-live="polite" aria-atomic="true">
      <div class="status"><span class="display-label">RESULTADO</span><div class="indicators"><span id="memory" title="Memoria guardada">M</span><span id="mode">DEG</span></div></div>
      <div id="expression" class="expression">0</div>
      <output id="result">0</output>
      <div class="screen-footer"><span><i aria-hidden="true"></i> Cálculo en tiempo real</span><span>NOVA / 01</span></div>
    </section>
    <div class="controls">
      <section class="science" aria-label="Funciones científicas">
        <div class="section-heading"><h2>Funciones</h2><span>CIENTÍFICA</span></div>
        <div class="mode-row"><button class="mode" id="angle" title="Alternar grados y radianes">DEG</button><button class="mode" id="inverse" aria-pressed="false" title="Funciones inversas">INV</button><button class="mode" id="secondary" aria-pressed="false" title="Funciones secundarias">2nd</button></div>
        <div class="science-grid">
          <button data-fn="sin">sin</button><button data-fn="cos">cos</button><button data-fn="tan">tan</button>
          <button data-fn="log">log</button><button data-fn="ln">ln</button><button data-fn="sqrt" aria-label="Raíz cuadrada">√</button>
          <button data-value="^" aria-label="Potencia">xʸ</button><button data-fn="square" aria-label="Al cuadrado">x²</button><button data-fn="reciprocal" aria-label="Recíproco">1/x</button>
          <button data-fn="factorial" aria-label="Factorial">x!</button><button data-fn="abs" aria-label="Valor absoluto">|x|</button><button class="fraction" data-value="/" title="Fracción: numerador, a/b y denominador">a⁄b</button>
          <button data-value="pi" aria-label="Pi">π</button><button data-value="e" aria-label="Constante e">e</button><button data-action="ans" title="Último resultado">Ans</button>
          <button data-value="(" aria-label="Abrir paréntesis">(</button><button data-value=")" aria-label="Cerrar paréntesis">)</button><button data-value="%" aria-label="Porcentaje">%</button>
        </div>
      </section>
      <section class="basic" aria-label="Teclado numérico y operaciones">
        <div class="section-heading"><h2>Teclado</h2><span>MEMORIA</span></div>
        <div class="memory-row"><button data-action="memory-clear" title="Borrar memoria">MC</button><button data-action="memory-recall" title="Recuperar memoria">MR</button><button data-action="memory-add" title="Sumar a memoria">M+</button><button data-action="memory-subtract" title="Restar de memoria">M−</button></div>
        <div class="keypad">
          <button data-action="clear" class="danger" title="Borrar todo (Esc)">AC</button><button data-action="negate" aria-label="Cambiar signo">±</button><button data-action="backspace" aria-label="Borrar último carácter" title="Borrar último carácter">⌫</button><button class="operator" data-value="/" aria-label="Dividir">÷</button>
          <button class="number" data-value="7">7</button><button class="number" data-value="8">8</button><button class="number" data-value="9">9</button><button class="operator" data-value="*" aria-label="Multiplicar">×</button>
          <button class="number" data-value="4">4</button><button class="number" data-value="5">5</button><button class="number" data-value="6">6</button><button class="operator" data-value="-" aria-label="Restar">−</button>
          <button class="number" data-value="1">1</button><button class="number" data-value="2">2</button><button class="number" data-value="3">3</button><button class="operator" data-value="+" aria-label="Sumar">+</button>
          <button class="number wide" data-value="0">0</button><button class="number" data-value=".">.</button><button class="equals" data-action="equals" title="Calcular (Enter)" aria-label="Calcular resultado">=</button>
        </div>
      </section>
    </div>
    <footer class="hint"><span>Un espacio para resolver.</span><span><kbd>Enter</kbd> calcular <b>·</b> <kbd>Esc</kbd> borrar</span></footer>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
